# ansible > install-nginx.yml
# pool_members 그룹의 모든 서버에 nginx를 설치하고 실행하는 Playbook

---
- name: Configure DNS and install nginx
  hosts: pool_members
  become: yes

  vars:
    # 인벤토리 호스트명 -> 각 pool member 전용 페이지 매핑
    poolmember_pages:
      pool-member-1: vm1.html
      pool-member-2: vm2.html

  pre_tasks:
    - name: Wait for SSH connection
      wait_for_connection:
        timeout: 300
        sleep: 5

  tasks:
    - name: Configure DNS
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 8.8.8.8

    - name: Stop unattended-upgrades service
      systemd:
        name: unattended-upgrades
        state: stopped
      ignore_errors: yes

    - name: Disable unattended-upgrades service
      systemd:
        name: unattended-upgrades
        enabled: no
      ignore_errors: yes

    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes
        lock_timeout: 300

    - name: Start nginx service
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy pool member index page (vm1.html -> pool-member-1, vm2.html -> pool-member-2)
      copy:
        src: "files/{{ poolmember_pages[inventory_hostname] }}"
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
      when: inventory_hostname in poolmember_pages